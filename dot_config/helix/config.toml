theme = "onedark"

[editor]
line-number = "relative"

# Show LSP errors inline (VS Code-style), not just underlined.
end-of-line-diagnostics = "hint"

[editor.inline-diagnostics]
cursor-line = "hint"
other-lines = "hint"

# VS Code-style line moving (Alt + arrow up/down)
[keys.normal]
"A-up" = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]
"A-down" = ["extend_to_line_bounds", "delete_selection", "move_line_down", "paste_before"]

# Also in insert mode (so it feels exactly like VS Code)
[keys.insert]
"A-up" = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]
"A-down" = ["extend_to_line_bounds", "delete_selection", "move_line_down", "paste_before"]
